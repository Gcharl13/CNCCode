<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNC Job Planner — Jobs</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161d26; --panel2:#1b2430; --line:#2a3543;
    --txt:#d7dee8; --dim:#8a93a3; --accent:#4f9cf0; --green:#43d17c; --red:#ef5350; --amber:#f0a84f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:var(--bg);color:var(--txt);font:14px/1.45 'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;min-height:100%;}

  header{display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;}
  header h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;}
  header .sub{color:var(--dim);font-size:12px;}
  header .spacer{flex:1;}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:9px 15px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--txt);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;}
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  a.navlink{color:var(--accent);text-decoration:none;font-size:13px;border:1px solid var(--line);padding:8px 12px;border-radius:7px;}
  a.navlink:hover{border-color:var(--accent);}

  main{flex:1;padding:22px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
  #empty{display:none;color:var(--dim);font-size:17px;text-align:center;margin-top:90px;}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:11px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .12s;}
  .card:hover{border-color:#3a4a5c;}
  .thumb{height:150px;background:var(--panel2) center/contain no-repeat;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;cursor:pointer;overflow:hidden;}
  .thumb img{width:100%;height:100%;object-fit:contain;display:block;}
  .body{padding:13px 14px;display:flex;flex-direction:column;gap:9px;flex:1;}
  .name{font-size:16px;font-weight:700;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .name:hover{color:var(--accent);}
  .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--dim);font-size:12px;}
  .badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:3px 9px;border-radius:6px;}
  .badge.spacer{background:rgba(79,156,240,.16);color:var(--accent);}
  .badge.cut{background:rgba(240,168,79,.18);color:var(--amber);}
  .badge.ready{background:rgba(79,156,240,.18);color:var(--accent);}
  .badge.running{background:rgba(240,168,79,.20);color:var(--amber);}
  .badge.done{background:rgba(67,209,124,.18);color:var(--green);}
  .actions{display:flex;gap:8px;margin-top:2px;}
  .actions .btn{flex:1;justify-content:center;padding:8px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:default;border-color:var(--line);}
  .btn.del{flex:0 0 auto;color:var(--dim);}
  .btn.del:hover{border-color:var(--red);color:var(--red);}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;padding:11px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s;}
  #toast.show{opacity:1;}
</style>
</head>
<body>
<header>
  <h1>CNC Job Planner</h1>
  <span class="sub">duct-bank spacers · NK105</span>
  <span class="spacer"></span>
  <button class="btn primary" id="btnNew">+ New job</button>
  <button class="btn" id="btnRefresh">Refresh</button>
  <a class="navlink" href="/kiosk">Kiosk ↗</a>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div id="empty">No jobs yet. Click <b>+ New job</b> to design a spacer.</div>
</main>

<div id="toast"></div>

<script>
'use strict';
var API = '/api';
var gridEl = document.getElementById('grid');
var emptyEl = document.getElementById('empty');

function jsonOpts(method, body) {
  return { method: method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) };
}
async function api(path, opts) {
  var res = await fetch(API + path, opts);
  if (!res.ok) {
    var m = 'HTTP ' + res.status;
    try { var b = await res.json(); if (b && b.error) m = b.error; } catch (e) {}
    throw new Error(m);
  }
  return res;
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 3500);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}
function stageOf(j) {
  if (j.status === 'ready') return { k: 'ready', label: 'Ready' };
  if (j.status === 'running') return { k: 'running', label: 'Cutting' };
  if (j.status === 'done') return { k: 'done', label: 'Done' };
  if (j.hasDxf) return { k: 'cut', label: 'Cut path' };
  return { k: 'spacer', label: 'Spacer' };
}
function ago(iso) {
  var s = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function cardHTML(j) {
  var st = stageOf(j);
  var thumb = j.hasThumb
    ? '<img src="' + API + '/jobs/' + j.id + '/thumb?v=' + encodeURIComponent(j.updatedAt) + '" alt="">'
    : 'no preview';
  return (
    '<div class="card" data-id="' + j.id + '">' +
      '<div class="thumb" data-go="spacer">' + thumb + '</div>' +
      '<div class="body">' +
        '<div class="name" data-go="spacer">' + escapeHtml(j.name) + '</div>' +
        '<div class="meta"><span class="badge ' + st.k + '">' + st.label + '</span>' +
          '<span>×' + (j.quantity || 0) + (j.completed ? ' · ' + j.completed + ' cut' : '') + '</span>' +
          '<span>· ' + ago(j.updatedAt) + '</span></div>' +
        '<div class="actions">' +
          '<button class="btn" data-go="spacer">Spacer</button>' +
          '<button class="btn" data-go="cut"' + (j.hasDxf ? '' : ' disabled title="Design the spacer first"') + '>Cut path →</button>' +
          '<button class="btn del" data-del title="Delete">🗑</button>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

async function load() {
  try {
    var jobs = await (await api('/jobs')).json();
    gridEl.innerHTML = jobs.map(cardHTML).join('');
    emptyEl.style.display = jobs.length ? 'none' : 'block';
  } catch (e) { toast('Load failed: ' + e.message); }
}

async function newJob() {
  var name = prompt('New job name:', 'Spacer ' + new Date().toLocaleDateString());
  if (name === null) return;
  try {
    var job = await (await api('/jobs', jsonOpts('POST', { name: name, units: 'in' }))).json();
    location.href = '/spacer?job=' + job.id;   // straight into spacer design
  } catch (e) { toast('Create failed: ' + e.message); }
}

gridEl.addEventListener('click', async function (e) {
  var card = e.target.closest('.card'); if (!card) return;
  var id = card.dataset.id;
  if (e.target.closest('[data-del]')) {
    if (!confirm('Delete this job?')) return;
    try { await api('/jobs/' + id, { method: 'DELETE' }); load(); }
    catch (err) { toast('Delete failed: ' + err.message); }
    return;
  }
  var go = e.target.closest('[data-go]');
  if (go) {
    if (go.dataset.go === 'cut' && go.disabled) return;
    location.href = '/' + (go.dataset.go === 'cut' ? 'cut' : 'spacer') + '?job=' + id;
  }
});

document.getElementById('btnNew').addEventListener('click', newJob);
document.getElementById('btnRefresh').addEventListener('click', load);
document.addEventListener('visibilitychange', function () { if (!document.hidden) load(); });
load();
setInterval(load, 6000);
</script>
</body>
</html>
