<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Production Queue — CNC Kiosk</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161d26; --panel2:#1b2430; --line:#2a3543;
    --txt:#d7dee8; --dim:#8a93a3; --accent:#4f9cf0; --green:#43d17c; --red:#ef5350; --amber:#f0a84f;
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--txt); font:16px/1.4 'Segoe UI',system-ui,sans-serif; display:flex; flex-direction:column; }

  header { display:flex; align-items:center; gap:16px; padding:14px 22px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:22px; margin:0; font-weight:700; letter-spacing:.02em; }
  header .counts { display:flex; gap:10px; }
  .pill { font-size:13px; padding:3px 10px; border-radius:999px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill b { color:var(--txt); }
  header .spacer { flex:1; }
  #clock { font-variant-numeric:tabular-nums; font-size:18px; color:var(--txt); }
  #live { display:inline-flex; align-items:center; gap:7px; color:var(--dim); font-size:13px; }
  #dot { width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 8px var(--green); transition:background .3s; }
  #dot.stale { background:var(--red); box-shadow:none; }
  a.navlink { color:var(--accent); text-decoration:none; font-size:14px; border:1px solid var(--line); padding:6px 12px; border-radius:6px; }
  a.navlink:hover { border-color:var(--accent); }

  #list { flex:1; overflow-y:auto; padding:16px 22px 40px; display:flex; flex-direction:column; gap:14px; }
  #empty { display:none; text-align:center; color:var(--dim); font-size:20px; margin-top:80px; }

  .card { display:flex; gap:18px; background:var(--panel); border:1px solid var(--line); border-left-width:6px; border-radius:10px; padding:16px 18px; align-items:center; }
  .card.running { border-left-color:var(--amber); }
  .card.ready   { border-left-color:var(--accent); }
  .card.done    { border-left-color:var(--green); opacity:.62; }

  .thumb { width:120px; height:120px; flex-shrink:0; border-radius:8px; background:var(--panel2) center/contain no-repeat; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:12px; overflow:hidden; }
  .thumb img { width:100%; height:100%; object-fit:contain; display:block; }

  .info { flex:1; min-width:0; }
  .info .name { font-size:22px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .info .meta { color:var(--dim); font-size:14px; margin-top:3px; }
  .badge { display:inline-block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 10px; border-radius:6px; margin-right:8px; vertical-align:middle; }
  .badge.running { background:rgba(240,168,79,.18); color:var(--amber); }
  .badge.ready   { background:rgba(79,156,240,.18); color:var(--accent); }
  .badge.done    { background:rgba(67,209,124,.18); color:var(--green); }

  .progwrap { margin-top:10px; }
  .prognum { font-size:15px; color:var(--txt); margin-bottom:5px; }
  .prognum b { font-size:20px; }
  .bar { height:12px; background:var(--panel2); border-radius:999px; overflow:hidden; border:1px solid var(--line); }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .4s; }
  .card.running .bar > div { background:var(--amber); }
  .card.done .bar > div { background:var(--green); }

  .actions { display:flex; flex-direction:column; gap:10px; flex-shrink:0; width:160px; }
  .btn { font:inherit; font-size:18px; font-weight:600; padding:14px 12px; border-radius:8px; border:1px solid var(--line); background:var(--panel2); color:var(--txt); cursor:pointer; text-align:center; text-decoration:none; min-height:54px; display:flex; align-items:center; justify-content:center; gap:8px; user-select:none; }
  .btn:hover { border-color:var(--accent); }
  .btn:active { transform:translateY(1px); }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.go { background:var(--green); border-color:var(--green); color:#08220f; }
  .btn.cut { background:var(--amber); border-color:var(--amber); color:#2a1a02; font-size:22px; }
  .btn.ghost { background:transparent; color:var(--dim); }

  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--red); color:#fff; padding:12px 20px; border-radius:8px; font-size:15px; opacity:0; pointer-events:none; transition:opacity .3s; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
<header>
  <h1>Production Queue</h1>
  <div class="counts">
    <span class="pill">Ready <b id="cReady">0</b></span>
    <span class="pill">Cutting <b id="cRunning">0</b></span>
    <span class="pill">Done <b id="cDone">0</b></span>
  </div>
  <span class="spacer"></span>
  <span id="live"><span id="dot"></span><span id="liveText">connecting…</span></span>
  <span id="clock">--:--:--</span>
  <a class="navlink" href="/">Design ↗</a>
</header>

<div id="list">
  <div id="empty">No jobs ready to cut. Finalize a job in the Design view and it appears here.</div>
</div>

<div id="toast"></div>

<script>
'use strict';
var API = '/api';
var listEl = document.getElementById('list');
var emptyEl = document.getElementById('empty');
var cards = new Map(); // id -> { el, key }
var lastOk = 0;

function jsonOpts(method, body) {
  return { method: method, headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) };
}
async function api(path, opts) {
  var res = await fetch(API + path, opts);
  if (!res.ok) {
    var m = 'HTTP ' + res.status;
    try { var b = await res.json(); if (b && b.error) m = b.error; } catch (e) {}
    throw new Error(m);
  }
  return res;
}
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 3500);
}
async function act(fn) { try { await fn(); await poll(); } catch (e) { toast(e.message); } }

function fmtEst(min) {
  if (min == null) return '';
  var m = Math.round(min);
  if (m < 60) return ' · ~' + m + ' min';
  return ' · ~' + Math.floor(m / 60) + 'h ' + (m % 60) + 'm';
}

function buildCard(j) {
  var card = document.createElement('div');
  card.className = 'card ' + j.status;

  // thumbnail
  var thumb = document.createElement('div');
  thumb.className = 'thumb';
  if (j.hasThumb) {
    var img = document.createElement('img');
    img.src = API + '/jobs/' + j.id + '/thumb?v=' + encodeURIComponent(j.updatedAt);
    img.alt = j.name;
    img.onerror = function () { thumb.textContent = 'no preview'; };
    thumb.appendChild(img);
  } else { thumb.textContent = 'no preview'; }
  card.appendChild(thumb);

  // info + progress
  var info = document.createElement('div');
  info.className = 'info';
  var statusLabel = j.status === 'running' ? 'cutting' : j.status;
  var qty = j.quantity || 0, done = j.completed || 0;
  var pct = qty > 0 ? Math.round(100 * Math.min(done, qty) / qty) : (j.status === 'done' ? 100 : 0);
  info.innerHTML =
    '<div class="name"><span class="badge ' + j.status + '">' + statusLabel + '</span>' + escapeHtml(j.name) + '</div>' +
    '<div class="meta">' + (j.units || '') + (j.hasNc ? '' : ' · no G-code') + fmtEst(j.estMinutes) + '</div>' +
    '<div class="progwrap"><div class="prognum"><b>' + done + '</b> / ' + qty + ' cut</div>' +
    '<div class="bar"><div style="width:' + pct + '%"></div></div></div>';
  card.appendChild(info);

  // actions
  var actions = document.createElement('div');
  actions.className = 'actions';
  var id = j.id;

  if (j.hasNc) {
    var dl = document.createElement('a');
    dl.className = 'btn'; dl.textContent = '⬇ .nc';
    dl.href = API + '/jobs/' + id + '/nc'; dl.setAttribute('download', '');
    // download button added per-state below to keep ordering sensible
    var addDl = function () { actions.appendChild(dl); };
  }

  if (j.status === 'ready') {
    actions.appendChild(mkBtn('▶ Start', 'btn primary', function () {
      act(function () { return api('/jobs/' + id + '/status', jsonOpts('POST', { status: 'running' })); });
    }));
    if (j.hasNc) addDl();
  } else if (j.status === 'running') {
    actions.appendChild(mkBtn('+1 cut', 'btn cut', function () {
      act(function () { return api('/jobs/' + id + '/progress', jsonOpts('POST', { delta: 1 })); });
    }));
    actions.appendChild(mkBtn('✓ Done', 'btn go', function () {
      act(function () { return api('/jobs/' + id + '/status', jsonOpts('POST', { status: 'done' })); });
    }));
    if (j.hasNc) addDl();
  } else if (j.status === 'done') {
    actions.appendChild(mkBtn('↺ Run again', 'btn ghost', function () {
      act(function () { return api('/jobs/' + id, jsonOpts('PUT', { status: 'ready', completed: 0 })); });
    }));
  }
  card.appendChild(actions);
  return card;
}

function mkBtn(label, cls, onclick) {
  var b = document.createElement('button');
  b.className = cls; b.textContent = label; b.addEventListener('click', onclick);
  return b;
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
  });
}

function orderJobs(jobs) {
  var asc = function (a, b) { return a.updatedAt < b.updatedAt ? -1 : 1; };
  var desc = function (a, b) { return a.updatedAt > b.updatedAt ? -1 : 1; };
  var running = jobs.filter(function (j) { return j.status === 'running'; }).sort(asc);
  var ready = jobs.filter(function (j) { return j.status === 'ready'; }).sort(asc); // FIFO: oldest waiting first
  var done = jobs.filter(function (j) { return j.status === 'done'; }).sort(desc).slice(0, 8);
  return running.concat(ready).concat(done);
}

function render(jobs) {
  var order = orderJobs(jobs);
  var seen = {};
  order.forEach(function (j) {
    seen[j.id] = true;
    var key = j.status + '|' + j.updatedAt + '|' + j.completed + '|' + j.quantity + '|' + j.hasThumb + '|' + j.hasNc;
    var entry = cards.get(j.id);
    if (!entry || entry.key !== key) {
      var el = buildCard(j);
      if (entry) entry.el.replaceWith(el); else listEl.appendChild(el);
      cards.set(j.id, { el: el, key: key });
      entry = cards.get(j.id);
    }
    listEl.appendChild(entry.el); // reorder in place (no rebuild)
  });
  cards.forEach(function (entry, id) { if (!seen[id]) { entry.el.remove(); cards.delete(id); } });

  emptyEl.style.display = order.length ? 'none' : 'block';
  document.getElementById('cReady').textContent = jobs.filter(function (j) { return j.status === 'ready'; }).length;
  document.getElementById('cRunning').textContent = jobs.filter(function (j) { return j.status === 'running'; }).length;
  document.getElementById('cDone').textContent = jobs.filter(function (j) { return j.status === 'done'; }).length;
}

async function poll() {
  try {
    var jobs = await (await api('/jobs')).json();
    render(jobs);
    lastOk = Date.now();
  } catch (e) { /* leave last view; liveness tick handles the dot */ }
}

function tick() {
  var d = new Date();
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  document.getElementById('clock').textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  var age = lastOk ? (Date.now() - lastOk) : Infinity;
  var dot = document.getElementById('dot'), txt = document.getElementById('liveText');
  if (age < 9000) { dot.classList.remove('stale'); txt.textContent = 'live'; }
  else { dot.classList.add('stale'); txt.textContent = lastOk ? 'reconnecting…' : 'connecting…'; }
}

poll();
setInterval(poll, 4000);
setInterval(tick, 1000);
tick();
</script>
</body>
</html>
